services:
  postgres:
    # Matches prod (Neon runs Postgres 18) so a prod dump restores cleanly
    # (pg_restore can't load a newer server's dump).
    image: postgres:18
    container_name: sports-auction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sportauction
    ports:
      - "5432:5432"
    volumes:
      # The 18+ image keeps its data under /var/lib/postgresql/<major>/, so the
      # volume mounts one level up. The old sports-auction-pgdata volume holds
      # Postgres 16 files this server can't open; it's left in place, unused,
      # as a fallback until you're sure you don't need it.
      - sports-auction-pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sports-auction-pgdata18:
