services:
  - type: web
    name: sports-auction
    runtime: node
    plan: free
    # TEMPORARY (multi-league-users Deploy 1 only): runs the LeagueMembership
    # backfill script as part of the build itself, before the new instance
    # ever serves a request — closes the gap between the additive migration
    # landing and every existing user's session having populated
    # memberships. Idempotent and self-verifying; safe to leave running more
    # than once, but should be reverted back to the plain command in a
    # follow-up commit once this deploy is confirmed stable.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npx tsx scripts/backfill-league-memberships.ts && npm run build
    startCommand: NODE_ENV=production npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
