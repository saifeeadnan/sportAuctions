services:
  - type: web
    name: sports-auction
    runtime: node
    plan: free
    # Note: this file is NOT actually synced by this Render service (confirmed
    # during the multi-league-users deploy — the live Build Command is set
    # directly in Render's dashboard Settings, not read from here). Kept
    # accurate anyway as a reference for what the command should be.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: NODE_ENV=production npm run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
